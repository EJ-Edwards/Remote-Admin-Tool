[project]
name = "sentinel-link-agent"
version = "0.1.0"
description = "Sentinel Link internal audit agent (metadata only, outbound HTTPS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
    "fastapi>=0.109.0",
]

[project.scripts]
sentinel-link = "main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "client", "config", "event_queue", "models", "server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["collectors*", "utils*"]
